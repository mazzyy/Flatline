databases:
  # Render deletes free databases 30 days after creation; upgrade this one
  # before then if the demo has to stay up longer.
  - name: flatline-db
    plan: free
    databaseName: flatline
    user: flatline

services:
  # One web service runs the API, the detector and the agent loop (RUN_WORKERS),
  # so the whole demo fits Render's free instances. Locally, docker compose runs
  # them as three processes.
  - type: web
    name: flatline-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: LLM_MODE
        value: live
      - key: RUN_WORKERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: flatline-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_PLAN_ID
        sync: false
      - key: PAYPAL_SANDBOX_PRODUCT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_FAST
        sync: false
      - key: MODEL_REASONING
        sync: false
      - key: DASHBOARD_PASSCODE
        sync: false
      - key: INJECT_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false

  - type: web
    name: demo-shop
    plan: free
    runtime: docker
    dockerfilePath: ./demo-shop/Dockerfile
    dockerContext: ./demo-shop
    envVars:
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: FLATLINE_API_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_PLAN_ID
        sync: false
