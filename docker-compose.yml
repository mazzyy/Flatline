name: flatline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flatline
      POSTGRES_PASSWORD: flatline
      POSTGRES_DB: flatline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flatline"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Ollama on the host machine, seen from inside the container
      OLLAMA_API_BASE: http://host.docker.internal:11434
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-MOCK}
      LLM_MODE: ${LLM_MODE:-mock}
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://flatline:flatline@postgres:5432/flatline
      APP_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  detector:
    build:
      context: .
    env_file: .env
    environment:
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-MOCK}
      LLM_MODE: ${LLM_MODE:-mock}
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://flatline:flatline@postgres:5432/flatline
    command: ["python", "-m", "flatline.detector.worker"]
    depends_on:
      api:
        condition: service_healthy

  agents:
    build:
      context: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Ollama on the host machine, seen from inside the container
      OLLAMA_API_BASE: http://host.docker.internal:11434
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-MOCK}
      LLM_MODE: ${LLM_MODE:-mock}
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://flatline:flatline@postgres:5432/flatline
    command: ["python", "-m", "flatline.loop"]
    depends_on:
      api:
        condition: service_healthy

  demo-shop:
    build: ./demo-shop
    env_file: .env
    environment:
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-MOCK}
      FLATLINE_API_URL: http://api:8000
      SHOP_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  seed:
    build:
      context: .
    env_file: .env
    environment:
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-MOCK}
      LLM_MODE: ${LLM_MODE:-mock}
      PYTHONPATH: /app
      FLATLINE_API_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg://flatline:flatline@postgres:5432/flatline
    command: ["python", "scripts/seed.py", "--minutes", "10"]
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
