name: checkout_failure_spike
metric: capture_failures
window_minutes: 5
multiplier: 3
min_count: 5
baseline_floor: 1
scope_key: none
evidence:
  - error_code_breakdown
  - distinct_buyers
  - active_config_diff
  - sample_orders
allowed_actions:
  - notify.alert
  - report.create
  - shop.banner.set
  - shop.config.rollback
average_order_value: 18.00
# Runbook the agents get: typical causes to confirm or reject, and usual fixes.
runbook:
  causes: "A shop config change deployed just before the failures (currency, product settings); buyer side card declines spread over many different buyers; PayPal answering with server errors."
  fixes: "Put up an honest banner while checkout is broken; roll back to the last good config version when a config change caused it; alert the merchant."
# After the fix is verified, code (no model) plans this for the customers whose
# checkout failed. A declined card is the buyer's to fix, so those are left alone.
recovery:
  action: recovery.payment_links.send
  skip_error_codes:
    - INSTRUMENT_DECLINED
