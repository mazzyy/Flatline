name: refund_wave
metric: refunds
window_minutes: 60
multiplier: 3
min_count: 4
baseline_floor: 1
scope_key: product_id
concentration_ratio: 0.5
evidence:
  - refunds_by_product
  - refunds_by_buyer
  - purchase_dates
  - linked_disputes
allowed_actions:
  - notify.alert
  - report.create
  - shop.product.pause_sales
average_order_value: 22.00
