name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PAYPAL_ENVIRONMENT: MOCK
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check flatline tests scripts
          mypy flatline

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Test
        run: pytest -q tests/unit tests/integration

      - name: Demo scenarios
        run: pytest -q tests/e2e/test_demo_scenarios.py

      - name: Dashboard lint
        if: hashFiles('dashboard/package.json') != ''
        run: |
          cd dashboard
          npm ci
          npm run lint
